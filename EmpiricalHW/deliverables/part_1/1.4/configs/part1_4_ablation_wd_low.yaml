# Part 1.4 Ablation A: lower weight decay (vs baseline part1_3_div_p97).
# Motivation: weight decay strongly affects grokking timing (Power et al.); weaker WD can change memorization vs generalization tradeoff.
out_dir: runs/part1_4_ablation_wd_low
seed: 42
device: auto
task: arith
split_seed: 0
p: 97
op: "/"
n_layer: 1
n_head: 4
n_embd: 128
dropout: 0.0
bias: true
block_size: 256
batch_size: 128
max_steps: 300000
lr: 0.001
weight_decay: 0.1
betas: [0.9, 0.999]
grad_clip: 1.0
log_every: 200
eval_every: 1000
save_every: 25000
warmup_steps: 0
loss_answer_only: true
