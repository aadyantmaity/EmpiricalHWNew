# Part 1.3: Modular division p=97 — grokking (full run; long).
# Tune on val if needed; grokking often needs many steps (paper-scale).
out_dir: runs/part1_3_div_p97
seed: 42
device: auto
task: arith
split_seed: 0
p: 97
op: "/"
n_layer: 1
n_head: 4
n_embd: 128
dropout: 0.0
bias: true
block_size: 256
batch_size: 128
max_steps: 300000
lr: 0.001
weight_decay: 1.0
betas: [0.9, 0.999]
grad_clip: 1.0
log_every: 200
eval_every: 1000
save_every: 25000
warmup_steps: 0
loss_answer_only: true
sanity_mask_first_body_tokens: 0
